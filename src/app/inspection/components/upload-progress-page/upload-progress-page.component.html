<div class="wrap">
  <div class="content">
    <h1 class="title">{{ copy().title }}</h1>
    <p class="subtitle">{{ copy().subtitle }}</p>
  </div>
  <div class="progress-block">
    <div class="progress-track">
      <div class="progress-fill" [style.width.%]="progress()"></div>
    </div>
    <div class="progress-value">{{ progress() }}%</div>
  </div>
</div>
