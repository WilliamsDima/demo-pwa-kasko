<app-modal-shell (backdropClick)="close.emit()">
  @if (showCloseButton()) {
    <button class="close-btn" type="button" (click)="close.emit()" aria-label="Закрыть">✕</button>
  }
  <div class="icon" [class.icon-danger]="icon() === 'danger'">!</div>
  <h2 class="title">{{ title() }}</h2>
  <p class="description">{{ description() }}</p>
  <div class="actions">
    <button class="btn btn-primary" type="button" (click)="primary.emit()">{{ primaryLabel() }}</button>
    @if (secondaryLabel(); as label) {
      <button class="btn btn-secondary" type="button" (click)="secondary.emit()">{{ label }}</button>
    }
  </div>
</app-modal-shell>
